  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

%20fill='%231b1916'/%3E%3Ctext%20x='50'%20y='56'%20font-family='Arial,sans-serif'%20font-size='64'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%20dominant-baseline='central'%3EV%3C/text%3E%3C/svg%3E\" placeholder=\"logo\"><\u002Fimage-slot>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#a59b8b;margin:0;\">06 \u2014 Business<\u002Fp>\n    <h2 style=\"font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-.02em;color:#1b1916;margin:14px 0 0;white-space:nowrap;\">We make money by selling dedicated launches for \u20ac4M per flight<\u002Fh2>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;max-width:1500px;\">\n      <p style=\"font-size:38px;line-height:1.4;color:#1b1916;margin:0;font-weight:400;\">Priya runs payload operations at an operator deploying a <span style=\"color:#5e7d90;font-weight:600;\">12-satellite constellation<\u002Fspan>. On a rideshare she waits <span style=\"color:#5e7d90;font-weight:600;\">14 months<\u002Fspan> for a slot, drops at the wrong orbit, and burns months re-phasing each satellite into place.<\u002Fp>\n      <p style=\"font-size:38px;line-height:1.4;color:#1b1916;margin:0;font-weight:400;\">Vela flies her whole constellation on a dedicated launch to the exact orbit in <span style=\"color:#5e7d90;font-weight:600;\">under 3 months<\u002Fspan>, for <span style=\"color:#5e7d90;font-weight:600;\">\u20ac4M<\u002Fspan>. She reaches revenue a year earlier \u2014 worth far more to her than the price of the launch.<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;color:#a59b8b;margin:0;\">\u2014 Priya, Head of Payloads at a satellite operator<\u002Fp>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela sells dedicated launches at \u20ac4M per flight. Is \u20ac4M a realistic and competitive price for a dedicated small-sat launch, and what gross margin would that imply at scale?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-hover=\"color:#5e5a50;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <button onclick=\"{{ next }}\" style=\"position:absolute;right:52px;bottom:44px;display:inline-flex;align-items:center;gap:12px;background:#1f1d1a;color:#f5f1e8;font-family:'Hanken Grotesk',sans-serif;font-size:21px;font-weight:500;padding:11px 22px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 8px 20px -10px rgba(31,29,26,.5);\" style-hover=\"background:#332f29;\">Go-to-market <span style=\"font-size:24px;\">\u2192<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 7. GO-TO-MARKET ============ -->\n<section data-label=\"Go-to-Market\" data-screen-label=\"07\" data-speaker-notes=\"\" style=\"display:flex;align-items:center;justify-content:center;padding:48px;font-family:'Hanken Grotesk',sans-serif;background:radial-gradient(60% 56% at 22% 26%,#e3d0a6 0%,rgba(227,208,166,0) 62%),radial-gradient(56% 58% at 82% 28%,#d2d4b2 0%,rgba(210,212,178,0) 60%),radial-gradient(70% 64% at 56% 100%,#ecdcb8 0%,rgba(236,220,184,0) 64%),linear-gradient(160deg,#ede6d2,#e6dcc2);\">\n  <div style=\"position:relative;width:100%;height:100%;background:#fcfbf8;border-radius:28px;box-shadow:0 50px 130px -30px rgba(40,30,18,.35),0 8px 24px -8px rgba(40,30,18,.16);border:1px solid rgba(120,108,90,.14);padding:72px 90px;overflow:hidden;display:flex;flex-direction:column;\">\n    <image-slot id=\"company-logo\" style=\"position:absolute;top:34px;right:44px;width:48px;height:48px;z-index:3;\" shape=\"rounded\" radius=\"12\" fit=\"contain\" src=\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%231b1916'/%3E%3Ctext%20x='50'%20y='56'%20font-family='Arial,sans-serif'%20font-size='64'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%20dominant-baseline='central'%3EV%3C/text%3E%3C/svg%3E\" placeholder=\"logo\"><\u002Fimage-slot>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#a59b8b;margin:0;\">07 \u2014 Go-to-Market<\u002Fp>\n    <h2 style=\"font-size:58px;line-height:1.08;font-weight:600;letter-spacing:-.02em;color:#1b1916;margin:14px 0 0;max-width:1340px;\">Land one launch, then own the customer's roadmap<\u002Fh2>\n    <p style=\"font-size:34px;line-height:1.34;color:#4a443b;margin:24px 0 0;max-width:1480px;\">Direct sales to satellite operators who are tired of waiting on rideshare \u2014 a short cycle that signs contracts before we fly, then expands into their whole program.<\u002Fp>\n    <div style=\"display:flex;gap:24px;margin-top:34px;flex:1;\">\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;\">\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#5e7d90;margin:0;\">01 \u00b7 Land<\u002Fp>\n        <p style=\"font-size:38px;font-weight:600;color:#1b1916;margin:18px 0 0;\">Dedicated small-sat launch<\u002Fp>\n        <p style=\"font-size:31px;color:#6b6457;line-height:1.4;margin:16px 0 0;\">Win operators burned by rideshare delays with a launch on <span style=\"color:#1b1916;font-weight:600;\">their schedule at \u20ac4M<\u002Fspan>. Contracts signed before first flight.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;\">\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#5e7d90;margin:0;\">02 \u00b7 Expand<\u002Fp>\n        <p style=\"font-size:38px;font-weight:600;color:#1b1916;margin:18px 0 0;\">Multi-launch constellations<\u002Fp>\n        <p style=\"font-size:31px;color:#6b6457;line-height:1.4;margin:16px 0 0;\">One satellite becomes a constellation \u2014 <span style=\"color:#1b1916;font-weight:600;\">multi-launch agreements<\u002Fspan> and annual capacity blocks lift contract value 5\u201310\u00d7.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;\">\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#5e7d90;margin:0;\">03 \u00b7 Scale<\u002Fp>\n        <p style=\"font-size:38px;font-weight:600;color:#1b1916;margin:18px 0 0;\">Sovereign &amp; defense<\u002Fp>\n        <p style=\"font-size:31px;color:#6b6457;line-height:1.4;margin:16px 0 0;\">European launch sovereignty unlocks <span style=\"color:#1b1916;font-weight:600;\">ESA and government framework contracts<\u002Fspan> \u2014 larger, multi-year, and sticky.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela&#x27;s go-to-market is land a dedicated launch with rideshare-frustrated operators, expand into multi-launch constellations, then scale into sovereign and defense contracts. Is this the right wedge and sequence, or is there a faster path to revenue?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-hover=\"color:#5e5a50;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729 x:1;\">\n        <div style=\"width:230px;flex:none;display:flex;align-items:center;\"><span style=\"font-size:34px;font-weight:600;color:#1b1916;\">SpaceX<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;background:#efe9df;border:1px solid rgba(120,108,90,.18);border-radius:14px;padding:24px 30px;display:flex;align-items:center;\"><p style=\"font-size:32px;line-height:1.3;color:#4a443b;margin:0;\">Cheaper launch on Transporter rideshare.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1;background:#f3eee4;border:1px solid rgba(120,108,90,.18);border-radius:14px;padding:24px 30px;display:flex;align-items:center;\"><p style=\"font-size:32px;line-height:1.3;color:#4a443b;margin:0;\">Dedicated north\u2013south orbits from our launch site that rideshare can't reach.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;align-items:stretch;flex:1;\">\n        <div style=\"width:230px;flex:none;display:flex;align-items:center;\"><span style=\"font-size:34px;font-weight:600;color:#1b1916;\">Rocket Lab<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;background:#efe9df;border:1px solid rgba(120,108,90,.18);border-radius:14px;padding:24px 30px;display:flex;align-items:center;\"><p style=\"font-size:32px;line-height:1.3;color:#4a443b;margin:0;\">Years of launch backlog and flight heritage.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1;background:#f3eee4;border:1px solid rgba(120,108,90,.18);border-radius:14px;padding:24px 30px;display:flex;align-items:center;\"><p style=\"font-size:32px;line-height:1.3;color:#4a443b;margin:0;\">We compete on a higher launch cadence.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;align-items:stretch;flex:1;\">\n        <div style=\"width:230px;flex:none;display:flex;align-items:center;\"><span style=\"font-size:34px;font-weight:600;color:#1b1916;\">Isar Aerospace<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;background:#efe9df;border:1px solid rgba(120,108,90,.18);border-radius:14px;padding:24px 30px;display:flex;align-items:center;\"><p style=\"font-size:32px;line-height:1.3;color:#4a443b;margin:0;\">A deeply funded European rival.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1;background:#f3eee4;border:1px solid rgba(120,108,90,.18);border-radius:14px;padding:24px 30px;display:flex;align-items:center;\"><p style=\"font-size:32px;line-height:1.3;color:#4a443b;margin:0;\">Our sovereign-launch strategy unlocks government capital.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela names its main competitors as SpaceX (Transporter rideshare), Rocket Lab, and Isar Aerospace. Are those the right competitors to call out, and who else \u2014 Firefly, Stoke Space, RFA, Orbex \u2014 should be on this slide?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-hover=\"color:#5e5a50;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1 02Fdiv>\n        <div style=\"background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:30px 34px;\"><p style=\"font-size:34px;font-weight:600;color:#1b1916;margin:0;\">Flight heritage &amp; licensing<\u002Fp><p style=\"font-size:27px;color:#6b6457;line-height:1.4;margin:12px 0 0;\">Customers and regulators only trust proven flights. FAA launch licenses, range approvals, and a mission track record accrue one launch at a time \u2014 and can't be simulated into existence.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela argues its moat is hardware you can&#x27;t download plus flight heritage and launch licensing. Is that a genuinely durable moat against well-funded rivals, or is it just table stakes?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-hover=\"color:#5e5a50;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11 px;text-align:center;background:linear-gradient(135deg,#eee6d6,#e1d6c0);color:#4a443b;font-family:'JetBrains Mono',monospace;font-size:31px;font-weight:500;\">Reusable first stage<\u002Fdiv>\n        <div style=\"border-radius:12px;padding:22px;text-align:center;background:linear-gradient(135deg,#f2ece0,#e7ddca);color:#4a443b;font-family:'JetBrains Mono',monospace;font-size:31px;font-weight:500;\">Recovery &amp; landing<\u002Fdiv>\n        <div style=\"border-radius:12px;padding:22px;text-align:center;background:linear-gradient(135deg,#ebe3d3,#dccfb6);color:#4a443b;font-family:'JetBrains Mono',monospace;font-size:31px;font-weight:500;\">Ground systems &amp; range<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:24px;justify-content:center;\">\n        <div><p style=\"font-size:34px;font-weight:600;color:#1b1916;margin:0;\">Reuse from day one<\u002Fp><p style=\"font-size:31px;color:#6b6457;line-height:1.34;margin:8px 0 0;\">The first stage flies back and re-flies \u2014 the core of our cost advantage.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:34px;font-weight:600;color:#1b1916;margin:0;\">Proven propellants<\u002Fp><p style=\"font-size:31px;color:#6b6457;line-height:1.34;margin:8px 0 0;\">Methalox engines: clean, deep-throttling, and built to be reused.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:34px;font-weight:600;color:#1b1916;margin:0;\">Boring where it counts<\u002Fp><p style=\"font-size:31px;color:#6b6457;line-height:1.34;margin:8px 0 0;\">Flight-proven avionics and ground systems, not science projects.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela&#x27;s vehicle uses reusable methalox engines, a reusable first stage, and otherwise proven subsystems. What are the highest-risk technical assumptions in this architecture for a pre-seed-stage company?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom: 600;letter-spacing:-.02em;color:#1b1916;margin:14px 0 0;max-width:1340px;\">From first static fire to a $10M seed in 18 months<\u002Fh2>\n    <div style=\"display:flex;gap:28px;margin:30px 0 132px;flex:1;\">\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:28px;color:#1b1916;\">6 MONTHS<\u002Fspan>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">PRODUCT<\u002Fp><p style=\"font-size:31px;font-weight:700;color:#1b1916;line-height:1.26;margin:0;\">Full-duration static fire<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">TEAM<\u002Fp><p style=\"font-size:24px;color:#1b1916;line-height:1.34;margin:0;\">Propulsion engineer<br>Test &amp; GSE engineer<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">KEY CUSTOMER<\u002Fp><p style=\"font-size:26px;color:#1b1916;line-height:1.3;margin:0;\">ESA rideshare at \u20ac2M ACV<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">REVENUE<\u002Fp><p style=\"font-size:33px;font-weight:500;color:#1b1916;letter-spacing:-.01em;margin:0;\">\u20ac12M backlog<\u002Fp><p style=\"font-size:24px;color:#6b6457;margin:5px 0 0;\">8 signed contracts<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:28px;color:#1b1916;\">12 MONTHS<\u002Fspan>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">PRODUCT<\u002Fp><p style=\"font-size:31px;font-weight:700;color:#1b1916;line-height:1.26;margin:0;\">First orbital launch<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">TEAM<\u002Fp><p style=\"font-size:24px;color:#1b1916;line-height:1.34;margin:0;\">GNC / avionics engineer<br>Launch operations lead<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">KEY CUSTOMER<\u002Fp><p style=\"font-size:26px;color:#1b1916;line-height:1.3;margin:0;\">Airbus payload at \u20ac6M ACV<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#a59b8b;margin:0 0 5px;\">REVENUE<\u002Fp><p style=\"font-size:33px;font-weight:500;color:#1b1916;letter-spacing:-.01em;margin:0;\">\u20ac45M backlog<\u002Fp><p style=\"font-size:24px;color:#6b6457;margin:5px 0 0;\">first orbital attempt<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1f1d1a;border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:28px;color:#e8e3d8;\">18 MONTHS \u00b7 SEED-READY<\u002Fspan>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#9a9286;margin:0 0 5px;\">PRODUCT<\u002Fp><p style=\"font-size:31px;font-weight:700;color:#f5f1e8;line-height:1.26;margin:0;\">First booster reflight<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#9a9286;margin:0 0 5px;\">TEAM<\u002Fp><p style=\"font-size:24px;color:#f5f1e8;line-height:1.34;margin:0;\">Recovery systems lead<br>VP Business Development<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#9a9286;margin:0 0 5px;\">KEY CUSTOMER<\u002Fp><p style=\"font-size:26px;color:#f5f1e8;line-height:1.3;margin:0;\">Defense / govt at \u20ac15M ACV<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.1em;color:#9a9286;margin:0 0 5px;\">REVENUE<\u002Fp><p style=\"font-size:33px;font-weight:500;color:#f5f1e8;letter-spacing:-.01em;margin:0;\">\u20ac120M backlog<\u002Fp><p style=\"font-size:24px;color:#c8c0b1;margin:5px 0 0;\">a16z \u00b7 Avalanche VC leads<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela&#x27;s plan is a full static fire at 6 months, first orbital launch at 12 months, and a booster reflight with \u20ac120M backlog at 18 months, then a $10M seed. Given it&#x27;s raising only \u20ac750K, is this timeline and capital plan realistic?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-hover=\"color:#5e5a50;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.83 8d3c4 0%,rgba(216,211,196,0) 64%),linear-gradient(160deg,#e2e6e4,#dcd5c8);\">\n  <div style=\"position:relative;width:100%;height:100%;background:#fcfbf8;border-radius:28px;box-shadow:0 50px 130px -30px rgba(40,30,18,.35),0 8px 24px -8px rgba(40,30,18,.16);border:1px solid rgba(120,108,90,.14);padding:72px 90px;overflow:hidden;display:flex;flex-direction:column;\">\n    <image-slot id=\"company-logo\" style=\"position:absolute;top:34px;right:44px;width:48px;height:48px;z-index:3;\" shape=\"rounded\" radius=\"12\" fit=\"contain\" src=\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%231b1916'/%3E%3Ctext%20x='50'%20y='56'%20font-family='Arial,sans-serif'%20font-size='64'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%20dominant-baseline='central'%3EV%3C/text%3E%3C/svg%3E\" placeholder=\"logo\"><\u002Fimage-slot>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#a59b8b;margin:0;\">12 \u2014 The 10-Year Case<\u002Fp>\n    <h2 style=\"font-size:58px;line-height:1.08;font-weight:600;letter-spacing:-.02em;color:#1b1916;margin:14px 0 0;max-width:1340px;\">The path to category winner is to vertically integrate<\u002Fh2>\n    <div style=\"display:flex;gap:24px;margin-top:40px;flex:1;\">\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;\">\n        <span style=\"font-size:60px;font-weight:700;color:#1b1916;letter-spacing:-.02em;\">10\u00d7<\u002Fspan>\n        <p style=\"font-size:40px;font-weight:600;color:#1b1916;margin:20px 0 0;\">Dominate the wedge<\u002Fp>\n        <p style=\"font-size:35px;color:#6b6457;line-height:1.4;margin:18px 0 0;\">Own dedicated small-sat launch \u2014 <span style=\"color:#1b1916;font-weight:600;\">100 launches a year at \u20ac4M each is \u20ac400M in annual revenue.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;\">\n        <span style=\"font-size:60px;font-weight:700;color:#1b1916;letter-spacing:-.02em;\">100\u00d7<\u002Fspan>\n        <p style=\"font-size:40px;font-weight:600;color:#1b1916;margin:20px 0 0;\">Expand vertically<\u002Fp>\n        <p style=\"font-size:35px;color:#6b6457;line-height:1.4;margin:18px 0 0;\">Build the satellite bus and payloads, not just the ride \u2014 <span style=\"color:#1b1916;font-weight:600;\">owning the full stack is a \u20ac4B-a-year business.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#f6f2ea;border:1px solid rgba(120,108,90,.16);border-radius:18px;padding:34px 36px;display:flex;flex-direction:column;\">\n        <span style=\"font-size:60px;font-weight:700;color:#1b1916;letter-spacing:-.02em;\">1000\u00d7<\u002Fspan>\n        <p style=\"font-size:40px;font-weight:600;color:#1b1916;margin:20px 0 0;\">Expand horizontally<\u002Fp>\n        <p style=\"font-size:35px;color:#6b6457;line-height:1.4;margin:18px 0 0;\">In-space logistics and point-to-point cargo \u2014 <span style=\"color:#1b1916;font-weight:600;\">the trillion-euro space-economy layer.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela&#x27;s 10-year case is 10\u00d7 (own small-sat launch, ~\u20ac400M/yr), 100\u00d7 (vertically integrate into satellites, ~\u20ac4B/yr), and 1000\u00d7 (in-space logistics, trillion-euro layer). Is this vertical-integration path believable, and where does it usually break?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-h dth:1400px;\">A pre-seed SLIP to take Vela from engine build to its first full-thrust static fire.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:40px;margin:64px 0 auto;max-width:1400px;\">\n      <div>\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;letter-spacing:.1em;text-transform:uppercase;color:#a59b8b;margin:0 0 14px;\">Raise progress<\u002Fp>\n        <div style=\"display:flex;height:52px;border-radius:10px;overflow:hidden;max-width:1320px;background:#eee7da;\"><div style=\"width:8%;background:#1b1916;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:44px;margin-top:16px;\"><span style=\"font-size:30px;color:#1b1916;\"><span style=\"display:inline-block;width:17px;height:17px;border-radius:4px;background:#1b1916;margin-right:10px;\"><\u002Fspan>\u20ac60K committed<\u002Fspan><span style=\"font-size:30px;color:#8f8676;\"><span style=\"display:inline-block;width:17px;height:17px;border-radius:4px;background:#eee7da;border:1px solid rgba(120,108,90,.35);margin-right:10px;\"><\u002Fspan>\u20ac750K target<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;letter-spacing:.1em;text-transform:uppercase;color:#a59b8b;margin:0 0 18px;\">Angels already committed<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1320px;\">\n          <p style=\"font-size:30px;color:#1b1916;margin:0;\"><span style=\"font-weight:600;\">Lars Boman<\u002Fspan> \u2014 former VP Propulsion, Ariane <span style=\"color:#6b6457;\">\u00b7 \u20ac20K<\u002Fspan><\u002Fp>\n          <p style=\"font-size:30px;color:#1b1916;margin:0;\"><span style=\"font-weight:600;\">Priya Shah<\u002Fspan> \u2014 Partner, Foghorn Ventures <span style=\"color:#6b6457;\">\u00b7 \u20ac10K<\u002Fspan><\u002Fp>\n          <p style=\"font-size:30px;color:#1b1916;margin:0;\"><span style=\"font-weight:600;\">Tobias Reuter<\u002Fspan> \u2014 Founder, OrbitWorks <span style=\"color:#6b6457;\">\u00b7 \u20ac10K<\u002Fspan><\u002Fp>\n          <p style=\"font-size:30px;color:#1b1916;margin:0;\"><span style=\"font-weight:600;\">Sofia Chen<\u002Fspan> \u2014 angel, ex-NASA JPL <span style=\"color:#6b6457;\">\u00b7 \u20ac10K<\u002Fspan><\u002Fp>\n          <p style=\"font-size:30px;color:#1b1916;margin:0;\"><span style=\"font-weight:600;\">Raj Patel<\u002Fspan> \u2014 Partner, Orbit Capital <span style=\"color:#6b6457;\">\u00b7 \u20ac10K<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela is raising \u20ac750K on a pre-seed SLIP to fund its first full-thrust test fire. Is \u20ac750K the right amount for that milestone, and what should the use-of-funds split and valuation cap look like?\" title=\"Ask Claude about this slide\" style=\"position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#9a9286;\" style-hover=\"color:#5e5a50;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1 :#1b1916;\"><span style=\"display:inline-block;width:17px;height:17px;border-radius:4px;background:#1b1916;margin-right:10px;\"><\u002Fspan>Founders 94%<\u002Fspan><span style=\"font-size:30px;color:#1b1916;\"><span style=\"display:inline-block;width:17px;height:17px;border-radius:4px;background:#7c97a8;margin-right:10px;\"><\u002Fspan>Angels &amp; SLIP 6%<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;letter-spacing:.1em;text-transform:uppercase;color:#a59b8b;margin:0 0 12px;\">Funding raised to date<\u002Fp>\n        <div style=\"display:flex;justify-content:space-between;padding:0 0 16px;margin-bottom:6px;border-bottom:2px solid rgba(120,108,90,.3);max-width:1320px;\"><span style=\"font-size:31px;color:#1b1916;font-weight:700;\">Total raised<\u002Fspan><span style=\"font-size:31px;color:#1b1916;font-weight:700;\">\u20ac250K \u00b7 \u20ac6M latest cap<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid rgba(120,108,90,.18);max-width:1320px;\"><span style=\"font-size:31px;color:#1b1916;\"><span style=\"font-weight:600;\">Lars Boman<\u002Fspan> \u2014 former VP Propulsion, Ariane <span style=\"color:#8f8676;\">(SLIP)<\u002Fspan><\u002Fspan><span style=\"font-size:31px;color:#6b6457;\">\u20ac150K \u00b7 \u20ac6M cap<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding:16px 0;max-width:1320px;\"><span style=\"font-size:31px;color:#1b1916;\"><span style=\"font-weight:600;\">Friends &amp; family<\u002Fspan> <span style=\"color:#8f8676;\">(SLIP)<\u002Fspan><\u002Fspan><span style=\"font-size:31px;color:#6b6457;\">\u20ac100K \u00b7 \u20ac5M cap<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ askClaude }}\" data-claude-q=\"Vela has raised \u20ac250K on SLIPs (\u20ac5\u20136M caps) with founders owning 94%. Is this cap table and ownership sp path><\u002Fsvg><\u002Fbutton>\n    <button onclick=\"{{ createMemo }}\" style=\"position:absolute;right:52px;bottom:44px;display:inline-flex;align-items:center;gap:12px;background:#1f1d1a;color:#f5f1e8;font-family:'Hanken Grotesk',sans-serif;font-size:21px;font-weight:500;padding:11px 22px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 8px 20px -10px rgba(31,29,26,.5);\" style-hover=\"background:#332f29;\">Create memo <span style=\"font-size:24px;\">\u2192<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    if (!window.__deckEditorBoot) { window.__deckEditorBoot = true; setTimeout(() => this.initEditor(), 60); }\n    if (window.__MAD_SLIDES && !window.__madAppBoot) { window.__madAppBoot = true; setTimeout(() => this.initApp(), 120); }\n    return {\n      next: () => { const s = document.querySelector('deck-stage'); if (s && s.next) s.next(); },\n      openSite: (e) => { e.preventDefault(); const t = (e.currentTarget.textContent || '').trim(); if (!t) return; const u = /^https?:\\/\\//i.test(t) ? t : 'https://' + t; window.open(u, '_blank'); },\n      createMemo: () => this.buildMemo(),\n      downloadPptx: () => this.exportPptx(),\n      askClaude: (e) => this.askClaude(e),\n      askClaudeAll: (e) => this.askClaudeAll(e),\n    };\n  }\n  _copyToClipboard(text, msg) {\n    const flash = () => {\n      const tip = document.createElement('div');\n      tip.textContent = msg;\n      tip.style.cssText = \"position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:#1f1d1a;color:#f5f1e8;font:500 18px/1.3 'Hanken Grotesk',sans-serif;padding:10px 18px;border-radius:999px;box-shadow:0 10px 24px -10px rgba(31,29,26,.55);z-index:99999;pointer-events:none;\";\n      document.body.appendChild(tip);\n      setTimeout(() => { tip.remove(); }, 1900);\n    };\n    const fallback = () => {\n      const ta = document.createElement('textarea');\n      ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';\n      document.body.appendChild(ta); ta.focus(); ta.select();\n      try { document.execCommand('copy'); } catch (_) {}\n      ta.remove();\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(flash, () => { fallback(); flash(); });\n    } else { fallback(); flash(); }\n  }\n  askClaude(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    const btn = e.currentTarget;\n    const q = ((btn && btn.getAttribute('data-claude-q')) || '').trim();\n    if (!q) return;\n    this._copyToClipboard(q, 'Question copied \u2014 paste into Claude');\n  }\n  askClaudeAll(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    const stage = document.querySelector('deck-stage');\n    const secs = stage ? stage.querySelectorAll(':scope > section') : document.querySelectorAll('section');\n    const lines = [];\n    secs.forEach(sec => {\n      const b = sec.querySelector('button[data-claude-q]');\n      if (!b) return;\n      const q = (b.getAttribute('data-claude-q') || '').trim();\n      if (!q) return;\n      const label = (sec.getAttribute('data-label') || '').trim();\n      lines.push((lines.length + 1) + '. ' + (label ? '[' + label + '] ' : '') + q);\n    });\n    if (!lines.length) return;\n    const text = \"Here are the questions to work through across Vela's pre-seed deck:\\n\\n\" + lines.join('\\n\\n');\n    this._copyToClipboard(text, lines.length + ' questions copied \u2014 paste into Claude');\n  }\n  buildMemo() {\n    const today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });\n    const SLIP_URL = 'https://ai-mad-lab.github.io/deck_template/pre-money-slip-template.pdf';\n    const SHA_URL = 'https://ai-mad-lab.github.io/deck_template/shareholders-agreement-template.pdf';\n\n    const css = [\n      'body{font-family:Georgia,\"Times New Roman\",serif;max-width:760px;margin:0 auto;padding:30px 30px 120px;color:#211f1b;line-height:1.62;font-size:17px;}',\n      '.bar{position:sticky;top:0;background:rgba(252,251,248,.94);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid #ece7dc;padding:14px 0;margin:-30px 0 10px;display:flex;gap:10px;z-index:5;}',\n      '.bar button{font-family:-apple-system,Arial,sans-serif;font-size:13.5px;padding:9px 16px;border-radius:9px;border:1px solid #d8d2c6;background:#fff;color:#211f1b;cursor:pointer;}',\n      '#copy{background:#1b1916;color:#f5f1e8;border-color:#1b1916;}',\n      '.bar .hint{margin-left:auto;align-self:center;font-family:-apple-system,Arial,sans-serif;font-size:12.5px;color:#9a8f7a;}',\n      'h1{font-size:30px;line-height:1.15;margin:18px 0 4px;letter-spacing:-.01em;}',\n      '.sub{color:#7a7264;font-family:-apple-system,Arial,sans-serif;font-size:13.5px;margin:0;}',\n      '.lead{font-family:-apple-system,Arial,sans-serif;font-size:13.5px;color:#7a7264;margin:14px 0 0;line-height:1.5;}',\n      '.part{font-family:-apple-system,Arial,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#1b1916;margin:44px 0 0;font-weight:700;}',\n      'h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:#1b1916;border-bottom:1px solid #e6e1d6;padding-bottom:6px;margin:30px 0 10px;font-family:-apple-system,Arial,sans-serif;font-weight:700;}',\n      'h3{font-size:19px;font-weight:600;margin:22px 0 4px;letter-spacing:-.01em;}',\n      'p{margin:18px 0;}',\n      'em.q{font-style:normal;font-weight:600;color:#1b1916;}',\n      '.note{background:#f7f4ec;border-left:3px solid #c9b79a;border-radius:0 10px 10px 0;padding:4px 20px;margin:14px 0;}',\n      '.note .who{font-family:-apple-system,Arial,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#1b1916;margin:12px 0 0;font-weight:700;}',\n      '.deal{border:1px solid #e2dccf;border-radius:14px;padding:6px 24px 16px;margin:16px 0;background:#fcfbf8;}',\n      '.deal table{width:100%;border-collapse:collapse;font-size:16px;}',\n      '.deal td{padding:9px 0;border-bottom:1px solid #efeae0;vertical-align:top;}',\n      '.deal td.k{color:#7a7264;font-family:-apple-system,Arial,sans-serif;font-size:13px;width:38%;padding-right:16px;}',\n      '.deal tr:last-child td{border-bottom:none;}',\n      '.big{font-size:18px;font-weight:600;}',\n      'a{color:#5e7d90;}',\n      '.sign{display:flex;gap:40px;margin-top:26px;font-family:-apple-system,Arial,sans-serif;font-size:13px;color:#7a7264;}',\n      '.sign .line{flex:1;border-top:1px solid #b9b09e;padding-top:7px;}',\n      '#memo[contenteditable]:focus{outline:none;}',\n      '#memo [contenteditable]{outline:none;}'\n    ].join('');\n\n    const body = `\n<p class=\"part\">Part I &middot; The Company &mdash; from the founder<\u002Fp>\n\n<h2>Overview<\u002Fh2>\n<p>We build fully reusable rockets that put small and medium satellites into their exact orbit, cheaply. Buy a rideshare slot today and you wait about a year, then get dropped into a shared orbit you spend months climbing out of. We fly you a dedicated launch instead: the booster lands itself, is refurbished in days, and flies again.<\u002Fp>\n<p><strong>That reuse is why we can charge roughly &euro;4M a flight &mdash; about 60% below a comparable dedicated launch.<\u002Fstrong> We&rsquo;re a Delaware C-Corp raising a pre-seed to carry us from engine build to our first full-thrust static fire, the milestone that de-risks everything after it.<\u002Fp>\n\n<h2>Market &amp; opportunity<\u002Fh2>\n<p>Launch is the chokepoint of the satellite economy, and reusable launch has minted giants &mdash; SpaceX (~$350B), Rocket Lab (~$10B), and Isar Aerospace (~&euro;1B). <strong>We go after the dedicated small- and medium-sat segment that rideshare serves badly:<\u002Fstrong> operators who need a specific orbit, on a specific date, for a constellation they can&rsquo;t afford to strand in the wrong plane.<\u002Fp>\n\n<h2>Team<\u002Fh2>\n<p>Between us we&rsquo;ve built and flown the hardest parts of a reusable rocket. <strong>Elena Marsh (CEO)<\u002Fstrong> led propulsion at SpaceX through 50+ static fires and owned booster-recovery GNC at Blue Origin for a stage that flew and landed six times (MS, Caltech). <strong>Daniel Reyes (CTO)<\u002Fstrong> built Rocket Lab&rsquo;s flight computer across 40+ Electron missions and wrote Mars-class landing guidance at NASA JPL (BS, MIT). <strong>We&rsquo;ve shipped propulsion, recovery, and flight software on vehicles that actually flew and landed &mdash; the rarest combination in the category.<\u002Fstrong><\u002Fp>\n\n<h2>Product &amp; technology<\u002Fh2>\n<p>We sell a dedicated launch, not a seat: you reach your exact orbit on your own schedule, without the months of re-phasing a rideshare forces on you. <strong>The vehicle is deliberately boring where it counts<\u002Fstrong> &mdash; reusable methalox engines, a first stage that flies back and re-flies, and flight-proven avionics and GNC. The cost edge comes from re-flying the stage, not from science projects.<\u002Fp>\n\n<h2>Traction<\u002Fh2>\n<p>Before our first flight we&rsquo;ve signed <strong>&euro;12M of backlog across eight launch contracts<\u002Fstrong>, plus &euro;40M of pipeline in signed LOIs. Named near-term customers include an ESA rideshare (&euro;2M) and an Airbus payload (&euro;6M), with defense and government work (&euro;15M) targeted as we approach seed.<\u002Fp>\n\n<h2>Business model<\u002Fh2>\n<p>We make money selling dedicated launches at roughly &euro;4M a flight. <strong>The real sell is timing, not price:<\u002Fstrong> an operator deploying a 12-satellite constellation waits ~14 months for a rideshare, drops at the wrong orbit, and burns months re-phasing &mdash; we fly the whole constellation to its exact orbit in under three, so it reaches revenue a year sooner. At 100 launches a year, &euro;4M each is &euro;400M in revenue, before buses, payloads, or in-space logistics.<\u002Fp>\n\n<h2>Go-to-market<\u002Fh2>\n<p>We sell direct to operators tired of rideshare delays, and we sign before we&rsquo;ve flown. <strong>The plan is land-and-expand:<\u002Fstrong> win an operator with one &euro;4M dedicated launch, grow it into multi-launch and annual-capacity deals worth five to ten times more, then into sovereign and defense work where European launch sovereignty opens ESA and government frameworks. The &euro;40M LOI pipeline is early proof it&rsquo;s real.<\u002Fp>\n\n<h2>Competition &amp; defensibility<\u002Fh2>\n<p>Each big rival beats us on one axis: SpaceX is cheaper on rideshare, Rocket Lab has flight heritage and backlog, and Isar is deeply funded in Europe. Our answers are dedicated north&ndash;south orbits rideshare can&rsquo;t reach, higher cadence than Rocket Lab, and a sovereign posture that unlocks European government capital against Isar. <strong>Underneath, the moat is physical and slow:<\u002Fstrong> engines, test stands, a launch site, FAA licenses, and a flight record that accrue one launch at a time and can&rsquo;t be downloaded.<\u002Fp>\n\n<h2>The round &amp; use of funds<\u002Fh2>\n<p>We&rsquo;re raising <strong>&euro;750K on a pre-seed SLIP<\u002Fstrong> to carry us from engine build through first full-thrust static fire &mdash; the milestone that proves the propulsion core and unlocks the seed. Funds go mostly to hardware: engine and test hardware (40%), avionics and GNC (20%), team and tooling (20%), launch site (15%), and G&amp;A (5%). We&rsquo;ve already raised &euro;250K on SLIPs (a &euro;150K lead from a former Ariane VP of Propulsion at a &euro;6M cap, and &euro;100K friends-and-family at a &euro;5M cap; latest cap &euro;6M), and still own ~94% of the company. Another ~&euro;60K is soft-committed from operators and angels, and we&rsquo;re targeting a16z and Avalanche VC as seed leads at ~18 months.<\u002Fp>\n\n<p class=\"part\">Part II &middot; Investor assessment &mdash; our notes<\u002Fp>\n<p class=\"lead\">Everything below is the investor&rsquo;s own view, prefilled with our draft assessment. Click any line to edit before circulating.<\u002Fp>\n\n<h2>Team assessment<\u002Fh2>\n<div class=\"note\">\n<p><strong>This is a team bet, and the team is exceptional for the stage.<\u002Fstrong> You rarely find a pre-seed pairing where one founder has led propulsion through 50+ static fires and owned recovery GNC, and the other has flown avionics across 40+ missions &mdash; at the very companies that define the field. Our one open question is org-building, not engineering: neither has scaled a hardware team past a small core, and the 18-month plan hires into a market where SpaceX and Rocket Lab chase the same people.<\u002Fp>\n<p class=\"who\">Conviction: high on founder-market fit; to confirm on hiring at scale.<\u002Fp>\n<\u002Fdiv>\n\n<h2>Key questions<\u002Fh2>\n<p><em class=\"q\">Is &euro;750K the right amount?<\u002Fem> Scoping the round to a static fire rather than first orbit is far more credible, and it buys the single most informative de-risking event available. The catch: first orbit, the backlog inflection, and the seed all sit beyond this round, so we&rsquo;re underwriting at least one more raise before a16z and Avalanche engage. <strong>We&rsquo;d want the founders&rsquo; own capital plan from static fire to orbit.<\u002Fstrong><\u002Fp>\n<p><em class=\"q\">How real is the &euro;12M backlog?<\u002Fem> Eight signed contracts pre-flight is strong, but we need to know how much is firm with deposits versus cancellable-on-slip. <strong>Backlog quality, not headline size, is the question.<\u002Fstrong><\u002Fp>\n<p><em class=\"q\">What is the regulatory and launch-site path?<\u002Fem> FAA licensing, range access, and a physical site are the moat &mdash; which makes them the schedule risk. <strong>We want the specific site, the license timeline, and what is gating versus already in motion.<\u002Fstrong><\u002Fp>\n<p><em class=\"q\">Why is this the right entry point for us?<\u002Fem> Pre-seed prices the team before launch risk is retired, and a mapped seed (a16z, Avalanche) gives us a defined follow-on path. <strong>We size for meaningful ownership while reserving capital for the seed.<\u002Fstrong><\u002Fp>\n\n<h2>Risks &amp; mitigants<\u002Fh2>\n<div class=\"note\">\n<p><strong>The dominant risk is the obvious one:<\u002Fstrong> capital-intensive hardware where first orbit is far from guaranteed and timelines slip. That is mitigated, though not removed, by a team that has flown reusable hardware, a deliberately boring subsystem strategy, and a plan that front-loads de-risking before the capital-heavy orbital push. Secondary risks are customer concentration and competition for talent; the &euro;40M pipeline partly offsets the first.<\u002Fp>\n<\u002Fdiv>\n\n<h2>Diligence to complete<\u002Fh2>\n<p><strong>Our diligence is limited to reference checks.<\u002Fstrong> Before close we will backchannel former colleagues of each founder at their named employers &mdash; SpaceX, Blue Origin, Rocket Lab, and JPL &mdash; and speak directly with the key customers behind the backlog, starting with the ESA and Airbus relationships. Nothing else is gating.<\u002Fp>\n\n<p class=\"part\">Part III &middot; Deal terms<\u002Fp>\n<h2>Instrument<\u002Fh2>\n<p>The investment is made on <strong>StartupLab&rsquo;s standard, founder-friendly paper<\u002Fstrong>: a <strong>pre-money SLIP<\u002Fstrong> (StartupLab&rsquo;s &ldquo;Startup&rsquo;s Lead Investment Paper&rdquo;), which converts to equity at the next priced round subject to the valuation cap below, governed on conversion by <strong>StartupLab&rsquo;s standard Shareholders&rsquo; Agreement<\u002Fstrong>. Both are attached and unmodified from StartupLab&rsquo;s templates:<\u002Fp>\n<p>&middot; <a href=\"${SLIP_URL}\">Pre-money SLIP &mdash; StartupLab standard template (attached)<\u002Fa><br>&middot; <a href=\"${SHA_URL}\">Shareholders&rsquo; Agreement &mdash; StartupLab standard template (attached)<\u002Fa><\u002Fp>\n\n<p class=\"part\">Part IV &middot; Recommendation<\u002Fp>\n<p>We recommend investing <strong>&euro;400,000<\u002Fstrong> in Vela, Inc. for approximately <strong>4.1%<\u002Fstrong>, on a <strong>&euro;9.75M post-money valuation cap<\u002Fstrong>.<\u002Fp>\n\n<div class=\"sign\">\n<div class=\"line\">Sponsor &mdash; name &amp; date<\u002Fdiv>\n<div class=\"line\">Investment Committee &mdash; decision &amp; date<\u002Fdiv>\n<\u002Fdiv>\n`;\n\n    const toolbar = '<div class=\"bar\"><button id=\"copy\">Copy memo<\u002Fbutton><button id=\"print\">Print / Save PDF<\u002Fbutton><button id=\"gdoc\">New Google Doc<\u002Fbutton><span class=\"hint\">Tip: click any text to edit before sharing<\u002Fspan><\u002Fdiv>';\n\n    const script = '<scr' + 'ipt>(function(){' +\n      'var memo=document.getElementById(\"memo\");' +\n      'document.getElementById(\"print\").onclick=function(){window.print();};' +\n      'document.getElementById(\"gdoc\").onclick=function(){window.open(\"https://docs.google.com/document/create\",\"_blank\");};' +\n      'document.getElementById(\"copy\").onclick=async function(){var b=this;try{await navigator.clipboard.write([new ClipboardItem({\"text/html\":new Blob([memo.innerHTML],{type:\"text/html\"}),\"text/plain\":new Blob([memo.innerText],{type:\"text/plain\"})})]);b.textContent=\"Copied \\\\u2713 \\\\u2014 paste into your doc\";}catch(e){var r=document.createRange();r.selectNode(memo);getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand(\"copy\");getSelection().removeAllRanges();b.textContent=\"Copied \\\\u2713 \\\\u2014 paste into your doc\";}};' +\n      '})();<\\u002Fscr' + 'ipt>';\n\n    const doc = '<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Vela &mdash; Investment Committee Memo<\u002Ftitle><style>' + css + '<\u002Fstyle><\u002Fhead><body>' +\n      toolbar +\n      '<div id=\"memo\" contenteditable=\"true\">' +\n      '<h1>Investment Committee Memo<\u002Fh1>' +\n      '<p class=\"sub\">Vela, Inc. &middot; Pre-seed &middot; Prepared ' + today + ' &middot; Confidential<\u002Fp>' +\n      body +\n      '<\u002Fdiv>' + script +\n      '<\u002Fbody><\u002Fhtml>';\n\n    const w = window.open('', '_blank');\n    if (!w) { alert('Please allow pop-ups to create the memo.'); return; }\n    w.document.open();\n    w.document.write(doc);\n    w.document.close();\n  }\n  async exportPptx() {\n    const PG = window.PptxGenJS, H = window.htmlToImage;\n    if (!PG || !H) { alert('Export tools are still loading \\u2014 please try again in a few seconds.'); return; }\n    const delay = ms => new Promise(r => setTimeout(r, ms));\n    const stage = document.querySelector('deck-stage');\n    const secs = [...stage.querySelectorAll(':scope > section')];\n    const dlBtn = document.getElementById('__deck_dl');\n    const status = (m) => { const s = document.getElementById('__deck_edit_status'); if (s) { s.textContent = m; s.style.opacity = '1'; } };\n    if (dlBtn) dlBtn.disabled = true;\n    status('Rendering 0/' + secs.length);\n    // capture cleanly: drop edit-mode outlines + contenteditable while rendering\n    const wasEditing = document.body.classList.contains('__deck_editing');\n    document.body.classList.remove('__deck_editing');\n    const ceEls = [...document.querySelectorAll('[data-edit-id]')];\n    ceEls.forEach(el => el.contentEditable = 'false');\n    try { await document.fonts.ready; } catch (e) {}\n    const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';\n    // flatten shadow-DOM <image-slot> elements so html-to-image can rasterize them\n    const restore = [];\n    [...document.querySelectorAll('image-slot')].forEach(slot => {\n      const img = document.createElement('img');\n      img.src = slot.getAttribute('src') || BLANK;\n      img.setAttribute('style', slot.getAttribute('style') || '');\n      img.style.objectFit = slot.getAttribute('fit') || 'cover';\n      const shape = slot.getAttribute('shape');\n      if (shape === 'circle') img.style.borderRadius = '50%';\n      else if (shape === 'rounded') img.style.borderRadius = (slot.getAttribute('radius') || '12') + 'px';\n      img.style.display = 'block';\n      const parent = slot.parentNode;\n      parent.replaceChild(img, slot);\n      restore.push([parent, slot, img]);\n    });\n    await Promise.all(restore.map(([, , img]) => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));\n    const opt = { width: 1920, height: 1080, pixelRatio: 1, backgroundColor: '#ffffff', cacheBust: true, imagePlaceholder: BLANK };\n    const pptx = new PG();\n    pptx.defineLayout({ name: 'W16x9', width: 13.333, height: 7.5 });\n    pptx.layout = 'W16x9';\n    for (let i = 0; i < secs.length; i++) {\n      if (stage.goTo) stage.goTo(i);          // activate the slide so its content is visible\n      await delay(550);\n      let url = null;\n      for (let a = 0; a < 3 && !url; a++) { try { url = await H.toPng(secs[i], opt); } catch (e) { await delay(350); } }\n      if (url) pptx.addSlide().addImage({ data: url, x: 0, y: 0, w: 13.333, h: 7.5 });\n      status('Rendering ' + (i + 1) + '/' + secs.length);\n    }\n    restore.forEach(([parent, slot, img]) => { try { parent.replaceChild(slot, img); } catch (e) {} });\n    if (wasEditing) { document.body.classList.add('__deck_editing'); ceEls.forEach(el => el.contentEditable = 'true'); }\n    if (stage.goTo) stage.goTo(0);\n    let name = 'Deck';\n    const t = document.querySelector('deck-stage > section h1, deck-stage > section h2');\n    if (t && t.textContent.trim()) name = t.textContent.trim().replace(/[\\\\/:*?\"<>|]+/g, ' ').slice(0, 60).trim();\n    status('Saving\\u2026');\n    await pptx.writeFile({ fileName: name + '.pptx' });\n    status('Downloaded \\u2713');\n    if (dlBtn) dlBtn.disabled = false;\n  }\n  initEditor() {\n    if (window.__deckEditorReady) return;\n    const stage = document.querySelector('deck-stage');\n    const secs = stage ? stage.querySelectorAll(':scope > section') : document.querySelectorAll('section');\n    if (!secs || !secs.length) { setTimeout(() => this.initEditor(), 150); return; }\n    window.__deckEditorReady = true;\n    this._editing = false;\n    this._slotSrc = new Map();\n    this._storeKey = 'deckEdits:' + location.pathname;\n    this._indexEditable(secs);\n    this._restoreEdits();\n    this._buildEditToolbar();\n    const auto = /(?:^|[?#&])edit\\b/i.test(location.search) || /(?:^|#)edit\\b/i.test(location.hash) || this._wasEditing;\n    if (auto) this._setEdit(true);\n    const obs = new MutationObserver(() => { if (!document.getElementById('__deck_edit_bar')) this._buildEditToolbar(); });\n    obs.observe(document.body, { childList: true });\n  }\n  _indexEditable(secs) {\n    const els = [], imgs = [];\n    const SEL = 'h1,h2,h3,h4,p,li,td,th,a,span,div,strong,em,b';\n    secs.forEach((sec, si) => {\n      sec.setAttribute('data-edit-sec', si);\n      sec.querySelectorAll(SEL).forEach(el => {\n        if (el.closest('button')) return;\n        if (el.closest('[data-edit-id]')) return;\n        if (el.querySelector('button, image-slot, svg')) return;\n        const hasText = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.replace(/\\s+/g, '').length);\n        if (!hasText) return;\n        const txt = (el.textContent || '').replace(/\\s+/g, ' ').trim();\n        if (!txt || txt === '\u2192' || txt === '\u27a4' || txt === '\u25b6') return;\n        el.setAttribute('data-edit-id', 's' + si + '-' + els.length);\n        els.push(el);\n      });\n      sec.querySelectorAll('image-slot').forEach((slot, ii) => {\n        slot.setAttribute('data-img-id', 's' + si + '-img' + ii);\n        imgs.push(slot);\n      });\n    });\n    this._editEls = els;\n    this._imgEls = imgs;\n  }\n  _setEdit(on) {\n    this._editing = on;\n    document.body.classList.toggle('__deck_editing', on);\n    (this._editEls || []).forEach(el => {\n      el.contentEditable = on ? 'true' : 'false';\n      if (on && !el.__editBound) { el.addEventListener('input', () => this._saveEdits()); el.__editBound = true; }\n    });\n    (this._imgEls || []).forEach(slot => {\n      if (on && !slot.__editBound) { slot.addEventListener('click', e => this._pickImage(e, slot)); slot.__editBound = true; }\n    });\n    if (on && !this._navGuard) {\n      this._navGuard = (e) => { if (this._editing && e.target && e.target.isContentEditable && /^Arrow| $|^Space$/.test(e.key)) e.stopPropagation(); };\n      document.addEventListener('keydown', this._navGuard, true);\n    }\n    const btn = document.getElementById('__deck_edit_toggle');\n    if (btn) btn.innerHTML = on ? '\u2713&nbsp; Done' : '\u270e&nbsp; Edit template';\n    this._saveEdits();\n  }\n  _saveEdits() {\n    clearTimeout(this._saveT);\n    this._saveT = setTimeout(() => {\n      const data = { text: {}, img: {}, editing: this._editing };\n      (this._editEls || []).forEach(el => { data.text[el.getAttribute('data-edit-id')] = el.innerHTML; });\n      (this._imgEls || []).forEach(slot => { const u = this._slotSrc.get(slot); if (u) data.img[slot.getAttribute('data-img-id')] = u; });\n      try { localStorage.setItem(this._storeKey, JSON.stringify(data)); this._flashSaved(); } catch (e) {}\n    }, 350);\n  }\n  _restoreEdits() {\n    let data; try { data = JSON.parse(localStorage.getItem(this._storeKey) || 'null'); } catch (e) {}\n    if (!data) return;\n    this._wasEditing = !!data.editing;\n    if (data.text) (this._editEls || []).forEach(el => { const v = data.text[el.getAttribute('data-edit-id')]; if (v != null) el.innerHTML = v; });\n    if (data.img) (this._imgEls || []).forEach(slot => { const v = data.img[slot.getAttribute('data-img-id')]; if (v) this._applyImage(slot, v); });\n  }\n  _pickImage(e, slot) {\n    if (!this._editing) return;\n    e.preventDefault(); e.stopPropagation();\n    const inp = document.createElement('input');\n    inp.type = 'file'; inp.accept = 'image/*';\n    inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { this._applyImage(slot, r.result); this._saveEdits(); }; r.readAsDataURL(f); };\n    inp.click();\n  }\n  _applyImage(slot, url) {\n    this._slotSrc.set(slot, url);\n    try { slot.setAttribute('src', url); } catch (e) {}\n    const img = slot.querySelector('img'); if (img) img.src = url;\n    if (slot.shadowRoot) { const si = slot.shadowRoot.querySelector('img'); if (si) si.src = url; }\n  }\n  _buildEditToolbar() {\n    if (document.getElementById('__deck_edit_bar')) return;\n    if (!document.getElementById('__deck_edit_style')) {\n      const st = document.createElement('style');\n      st.id = '__deck_edit_style';\n      st.textContent = '#__deck_edit_bar{position:fixed;left:20px;bottom:20px;z-index:2147483000;display:flex;gap:8px;align-items:center;font-family:-apple-system,Arial,sans-serif;}' +\n        '#__deck_edit_bar button{font:600 14px/1 -apple-system,Arial,sans-serif;padding:11px 17px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:#fff;color:#1b1916;cursor:pointer;box-shadow:0 10px 24px -12px rgba(0,0,0,.55);}' +\n        '#__deck_edit_bar button:hover{background:#f4f0e8;}' +\n        '#__deck_edit_toggle{background:#1b1916;color:#f5f1e8;border-color:#1b1916;}' +\n        '#__deck_edit_toggle:hover{background:#332f29;}' +\n        '#__deck_edit_bar .st{font:600 12px/1 -apple-system,Arial,sans-serif;color:#f5f1e8;background:rgba(27,25,22,.82);padding:8px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;}' +\n        'body.__deck_editing [data-edit-id]{outline:1px dashed rgba(94,125,144,.4);outline-offset:2px;border-radius:3px;transition:background .12s;}' +\n        'body.__deck_editing [data-edit-id]:hover{outline-color:rgba(94,125,144,.85);background:rgba(94,125,144,.07);}' +\n        'body.__deck_editing [data-edit-id]:focus{outline:2px solid #5e7d90;background:rgba(94,125,144,.10);}' +\n        'body.__deck_editing image-slot{outline:2px dashed rgba(189,106,68,.65);outline-offset:3px;cursor:pointer;}' +\n        'body.__deck_editing image-slot:hover{outline-color:rgba(189,106,68,1);}';\n      document.head.appendChild(st);\n    }\n    const bar = document.createElement('div');\n    bar.id = '__deck_edit_bar';\n    bar.innerHTML = '<button id=\"__deck_edit_toggle\">\u270e&nbsp; Edit template<\u002Fbutton>' +\n      '<button id=\"__deck_dl\" title=\"Download the deck as a PowerPoint file\">\u2b07&nbsp; Download .pptx<\u002Fbutton>' +\n      '<button id=\"__deck_edit_reset\" title=\"Clear your edits and restore the original\">Reset<\u002Fbutton>' +\n      '<span class=\"st\" id=\"__deck_edit_status\">Saved<\u002Fspan>';\n    document.body.appendChild(bar);\n    document.getElementById('__deck_edit_toggle').onclick = () => this._setEdit(!this._editing);\n    document.getElementById('__deck_dl').onclick = () => this.exportPptx();\n    document.getElementById('__deck_edit_reset').onclick = () => { if (confirm('Clear all your edits and restore the original template?')) { try { localStorage.removeItem(this._storeKey); } catch (e) {} location.reload(); } };\n  }\n  _flashSaved() {\n    const s = document.getElementById('__deck_edit_status');\n    if (!s) return;\n    s.style.opacity = '1';\n    clearTimeout(this._stT);\n    this._stT = setTimeout(() => { s.style.opacity = '0'; }, 1000);\n  }\n  initApp() {\n    if (window.__madAppReady) return;\n    const stage = document.querySelector('deck-stage');\n    const secs = stage ? stage.querySelectorAll(':scope > section') : [];\n    if (!stage || !secs.length) { setTimeout(() => this.initApp(), 150); return; }\n    window.__madAppReady = true;\n    document.body.classList.add('__mad_app');\n    // make room for the top bar (deck-stage is position:fixed, top:0)\n    stage.style.top = '54px';\n    stage.style.height = 'calc(100vh - 54px)';\n    this._buildAppBar();\n    const obs = new MutationObserver(() => { if (!document.getElementById('__mad_bar')) this._buildAppBar(); });\n    obs.observe(document.body, { childList: true });\n  }\n  _deckTitle() {\n    const t = document.querySelector('deck-stage > section h1, deck-stage > section h2');\n    return (t && t.textContent.trim()) ? t.textContent.trim() : 'Untitled deck';\n  }\n  _buildAppBar() {\n    if (document.getElementById('__mad_bar')) return;\n    if (!document.getElementById('__mad_style')) {\n      const st = document.createElement('style');\n      st.id = '__mad_style';\n      st.textContent =\n        '#__mad_bar{position:fixed;top:0;left:0;right:0;height:54px;z-index:2147483600;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fbfaf7;border-bottom:1px solid #e7e2d8;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;box-shadow:0 1px 0 rgba(0,0,0,.02);}' +\n        '#__mad_bar .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:#1b1916;letter-spacing:-.01em;}' +\n        '#__mad_bar .brand .dot{width:22px;height:22px;border-radius:7px;background:#1b1916;color:#f5f1e8;display:flex;align-items:center;justify-content:center;font-size:13px;}' +\n        '#__mad_bar .title{font-size:14px;color:#3f3a33;font-weight:500;padding:5px 9px;border-radius:7px;border:1px solid transparent;max-width:340px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;outline:none;}' +\n        '#__mad_bar .title:hover{border-color:#e7e2d8;}#__mad_bar .title:focus{border-color:#5e7d90;background:#fff;}' +\n        '#__mad_bar .sp{flex:1;}' +\n        '#__mad_bar .grp{display:flex;align-items:center;gap:8px;}' +\n        '#__mad_bar button{font:600 13.5px/1 -apple-system,Arial,sans-serif;padding:9px 14px;border-radius:9px;border:1px solid #ddd7cb;background:#fff;color:#1b1916;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}' +\n        '#__mad_bar button:hover{background:#f3efe7;}' +\n        '#__mad_bar button.primary{background:#1b1916;color:#f5f1e8;border-color:#1b1916;}#__mad_bar button.primary:hover{background:#332f29;}' +\n        '#__mad_bar button.on{background:#5e7d90;color:#fff;border-color:#5e7d90;}' +\n        '#__mad_menu{position:fixed;top:50px;right:16px;z-index:2147483600;background:#fff;border:1px solid #e2dccf;border-radius:12px;box-shadow:0 18px 40px -16px rgba(0,0,0,.4);padding:6px;min-width:230px;display:none;font-family:-apple-system,Arial,sans-serif;}' +\n        '#__mad_menu.open{display:block;}' +\n        '#__mad_menu button{display:flex;width:100%;justify-content:flex-start;gap:10px;background:none;border:none;border-radius:8px;padding:10px 12px;font:500 14px/1.2 -apple-system,Arial,sans-serif;color:#1b1916;cursor:pointer;text-align:left;}' +\n        '#__mad_menu button:hover{background:#f3efe7;}' +\n        '#__mad_menu .mtag{margin-left:auto;color:#a59b8b;font-size:11.5px;}' +\n        '#__mad_status{font:600 12px/1 -apple-system,Arial,sans-serif;color:#fff;background:rgba(27,25,22,.85);padding:8px 12px;border-radius:999px;position:fixed;top:62px;right:16px;z-index:2147483600;opacity:0;transition:opacity .25s;pointer-events:none;}' +\n        'body.__mad_app #__deck_edit_bar{display:none!important;}' +\n        'body.__mad_present #__mad_bar,body.__mad_present #__mad_menu{display:none!important;}';\n      document.head.appendChild(st);\n    }\n    const bar = document.createElement('div');\n    bar.id = '__mad_bar';\n    bar.innerHTML =\n      '<div class=\"brand\"><span class=\"dot\">\u25c6<\u002Fspan> Mad Slides<\u002Fdiv>' +\n      '<div class=\"title\" id=\"__mad_title\" contenteditable=\"true\" spellcheck=\"false\"><\u002Fdiv>' +\n      '<div class=\"sp\"><\u002Fdiv>' +\n      '<div class=\"grp\">' +\n      '<button id=\"__mad_edit\">\u270e Edit<\u002Fbutton>' +\n      '<button id=\"__mad_present\" class=\"primary\">\u25b7 Present<\u002Fbutton>' +\n      '<button id=\"__mad_export\">\u2913 Export \u25be<\u002Fbutton>' +\n      '<\u002Fdiv>';\n    document.body.appendChild(bar);\n    const menu = document.createElement('div');\n    menu.id = '__mad_menu';\n    menu.innerHTML =\n      '<button data-act=\"pptx\">Download PowerPoint <span class=\"mtag\">.pptx<\u002Fspan><\u002Fbutton>' +\n      '<button data-act=\"pdf\">Download / Print <span class=\"mtag\">PDF<\u002Fspan><\u002Fbutton>' +\n      '<button data-act=\"memo\">Create investment memo <span class=\"mtag\">\u2197<\u002Fspan><\u002Fbutton>';\n    document.body.appendChild(menu);\n    let status = document.getElementById('__mad_status');\n    if (!status) { status = document.createElement('div'); status.id = '__mad_status'; document.body.appendChild(status); }\n\n    const title = document.getElementById('__mad_title');\n    title.textContent = this._deckTitle();\n    title.addEventListener('focus', () => { if (title.textContent === 'Untitled deck') title.textContent = ''; });\n\n    document.getElementById('__mad_edit').onclick = (e) => {\n      this._setEdit(!this._editing);\n      e.currentTarget.classList.toggle('on', this._editing);\n      e.currentTarget.innerHTML = this._editing ? '\u2713 Done' : '\u270e Edit';\n    };\n    if (this._editing) { const _eb = document.getElementById('__mad_edit'); _eb.classList.add('on'); _eb.innerHTML = '\u2713 Done'; }\n    document.getElementById('__mad_present').onclick = () => this._present();\n    document.getElementById('__mad_export').onclick = (e) => { e.stopPropagation(); menu.classList.toggle('open'); };\n    document.addEventListener('click', () => menu.classList.remove('open'));\n    menu.addEventListener('click', (e) => {\n      const b = e.target.closest('button'); if (!b) return;\n      menu.classList.remove('open');\n      const act = b.getAttribute('data-act');\n      if (act === 'pptx') this.exportPptx();\n      else if (act === 'pdf') this._exportPdf();\n      else if (act === 'memo') this.buildMemo();\n    });\n  }\n  _madStatus(msg) {\n    const s = document.getElementById('__mad_status'); if (!s) return;\n    s.textContent = msg; s.style.opacity = '1';\n    clearTimeout(this._madT); this._madT = setTimeout(() => { s.style.opacity = '0'; }, 1400);\n  }\n  _present() {\n    const stage = document.querySelector('deck-stage');\n    this._preTop = stage.style.top; this._preH = stage.style.height;\n    document.body.classList.add('__mad_present');\n    stage.style.top = '0'; stage.style.height = '100vh';\n    stage.style.setProperty('--deck-rail-w', '0px');\n    const el = document.documentElement;\n    if (el.requestFullscreen) { try { el.requestFullscreen(); } catch (e) {} }\n    if (!this._fsBound) { this._fsBound = () => { if (!document.fullscreenElement) this._exitPresent(); }; document.addEventListener('fullscreenchange', this._fsBound); }\n    if (!this._escBound) { this._escBound = (e) => { if (e.key === 'Escape' && document.body.classList.contains('__mad_present')) this._exitPresent(); }; document.addEventListener('keydown', this._escBound, true); }\n    this._madStatus('Presenting \u2014 arrow keys to navigate, Esc to exit');\n  }\n  _exitPresent() {\n    const stage = document.querySelector('deck-stage');\n    document.body.classList.remove('__mad_present');\n    stage.style.top = this._preTop || '54px';\n    stage.style.height = this._preH || 'calc(100vh - 54px)';\n    stage.style.removeProperty('--deck-rail-w');\n    if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) {} }\n  }\n  _exportPdf() {\n    this._madStatus('Opening print dialog \u2014 choose \u201cSave as PDF\u201d');\n    const wasEditing = document.body.classList.contains('__deck_editing');\n    if (wasEditing) this._setEdit(false);\n    setTimeout(() => { window.print(); }, 250);\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"</script>
